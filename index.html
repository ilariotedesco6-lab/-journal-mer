<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Journal Mer</title>
<style>
:root{--bg:#0f1a22;--fg:#eef2f5;--muted:#8fa3b3;--line:#26394a;--card:#16232d;--accent:#bcd246;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px}
.logo{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:1.5rem}
.logo span{color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips button{flex:none;font:inherit;font-size:.85rem;background:var(--card);border:1px solid var(--line);color:var(--fg);padding:6px 14px;border-radius:20px;cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#0f1a22;font-weight:600}
.mosaic{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:190px;gap:10px;padding:12px;max-width:1100px;margin:0 auto}
.tile{position:relative;overflow:hidden;border-radius:6px;cursor:pointer;color:#fff;display:flex;align-items:flex-end;transition:transform .15s}
.tile:hover{transform:scale(1.015)}
.tile .em{position:absolute;right:8px;top:2px;font-size:4.5rem;opacity:.35}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile.big .em{font-size:9rem}
.tile.wide{grid-column:span 2}
.tile .txt{position:relative;width:100%;padding:34px 14px 12px;background:linear-gradient(to top,rgba(0,0,0,.75),transparent)}
.tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--accent)}
.tile h3{margin:4px 0 0;font-family:Georgia,serif;font-size:1.05rem;line-height:1.25}
.tile.big h3{font-size:1.9rem}
.g0{background:linear-gradient(135deg,#0e5a7a,#1d9a8f)}
.g1{background:linear-gradient(135deg,#2e6b2e,#8bb83a)}
.g2{background:linear-gradient(135deg,#5b2a86,#d0488a)}
.g3{background:linear-gradient(135deg,#b3541e,#e9b44c)}
.reader{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;overflow:hidden}
.reader.show{display:block}
.rbar{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;z-index:3}
.rbar button,.arrow{font:inherit;background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:1.2rem;cursor:pointer}
.rbar span{background:rgba(0,0,0,.45);color:#fff;padding:5px 12px;border-radius:20px;font-size:.8rem}
.page{position:absolute;inset:0;overflow-y:auto;transform-origin:center;backface-visibility:hidden}
.cover{height:42vh;min-height:230px;display:flex;align-items:flex-end;justify-content:center;font-size:8rem;position:relative}
.cover::after{content:"";position:absolute;inset:auto 0 0;height:70px;background:linear-gradient(to top,var(--bg),transparent)}
.body{max-width:680px;margin:0 auto;padding:6px 20px calc(60px + env(safe-area-inset-bottom,0px))}
.body h2{font-family:Georgia,serif;font-size:clamp(1.7rem,6vw,2.5rem);line-height:1.2;margin:8px 0}
.date{color:var(--muted);font-size:.85rem}
.body p{font-family:Georgia,serif;font-size:1.1rem;line-height:1.7}
.arrow{position:absolute;top:50%;margin-top:-20px;z-index:3}
.arrow.l{left:10px}.arrow.r{right:10px}
.arrow:disabled{opacity:.25;cursor:default}
@media(max-width:700px){.mosaic{grid-template-columns:repeat(2,1fr);grid-auto-rows:165px;padding:8px;gap:8px}.tile.big .em{font-size:6rem}.tile.big h3{font-size:1.4rem}}
</style>
</head>
<body>
<div class="top"><div class="logo">Le Journal <span>Mer</span></div><div class="chips" id="chips"></div></div>
<div class="mosaic" id="mosaic"></div>
<div class="reader" id="reader">
<div class="rbar"><button id="close" aria-label="Fermer">✕</button><span id="count"></span></div>
<div class="page" id="page"></div>
<button class="arrow l" id="prev" aria-label="Précédent">‹</button>
<button class="arrow r" id="next" aria-label="Suivant">›</button>
</div>
<script>
var G={"Actualité":0,"Sport":1,"Culture":2,"Sciences":3};
var E={"Actualité":"🏙️","Sport":"⚽","Culture":"🎬","Sciences":"🔬"};
var D=[
{c:"Actualité",t:"Lancement de VigiMobile et VigiUp pour les vigilances sanitaires",d:"5 novembre 2026",s:"maroc.ma",x:"Les plateformes VigiMobile et VigiUp ont été lancées officiellement au Maroc.\n\nElles viennent renforcer le dispositif national des vigilances sanitaires."},
{c:"Actualité",t:"51e anniversaire de la Marche Verte",d:"5 novembre 2026",s:"maroc.ma",x:"Le Maroc célèbre le 51e anniversaire de la Marche Verte.\n\nLes médias officiels parlent d’une épopée nationale renouvelée et d’acquis diplomatiques consolidés."},
{c:"Sport",t:"Les Lions de l’Atlas jouent à Casablanca le 13 novembre",d:"Match le 13 novembre 2026",s:"lesiteinfo.com",x:"La Fédération royale marocaine de football a annoncé que le match contre le Niger, pour la troisième journée, aura lieu le vendredi 13 novembre 2026 à 20h00 GMT, au Complexe sportif Mohammed V de Casablanca.\n\nLa quatrième journée est prévue le mardi 17 novembre à 20h00 GMT, au stade Prince Moulay Abdellah de Rabat."},
{c:"Actualité",t:"L’emploi et le dialogue social au cœur d’une rencontre",d:"4 novembre 2026",s:"maroc.ma",x:"La CGEM et le ministre de l’Emploi et du Dialogue social se sont rencontrés pour parler de l’emploi et des priorités du dialogue social."},
{c:"Actualité",t:"Le programme Moutatawi3 pourrait durer toute l’année",d:"4 novembre 2026",s:"maroc.ma",x:"Le ministère de la Jeunesse prévoit d’étendre le programme « Moutatawi3 » sur toute l’année."},
{c:"Actualité",t:"Hausse des prix du carburant : un soutien pour les transporteurs",d:"3 novembre 2026",s:"maroc.ma",x:"Face à la hausse des prix des produits pétroliers, le soutien exceptionnel et direct destiné aux professionnels du transport routier se poursuit."},
{c:"Actualité",t:"Sécurité hydrique : une nouvelle stratégie face au climat",d:"3 novembre 2026",s:"maroc.ma",x:"Une nouvelle stratégie de sécurité hydrique, adaptée aux grands changements climatiques, a été lancée."},
{c:"Actualité",t:"Airbnb : les règles sur la photo de la CIN changent le 20 novembre",d:"3 novembre 2026",s:"bladi.net",x:"Airbnb renforce les restrictions sur les documents d’identité que les hôtes peuvent demander aux voyageurs.\n\nLes nouvelles règles s’appliquent à partir du 20 novembre 2026, y compris pour les hôtes au Maroc qui demandent une photo de la CIN."},
{c:"Culture",t:"Marrakech : le festival du film dévoile sa sélection",d:"2 novembre 2026",s:"lematin.ma",x:"La 23e édition du Festival international du film de Marrakech aura lieu du 20 au 28 novembre 2026, avec 76 films venus de 39 pays.\n\nDix films seront présentés en première mondiale. Onze films marocains sont à l’affiche, dont « Alkebulan » de Yassine Marco Marroccu, en lice pour l’Étoile d’or."},
{c:"Sciences",t:"Un dinosaure du Brésil relance le rêve de Jurassic Park",d:"2 novembre 2026",s:"futura-sciences.com",x:"Une équipe internationale de chercheurs, dirigée par l’Université Curtin en Australie, a fait une découverte inattendue dans les os fossilisés d’un dinosaure trouvé au Brésil.\n\nL’étude, publiée dans la revue PNAS, relance la question de la conservation de l’ADN sur des millions d’années."},
{c:"Culture",t:"La Semaine du Maroc à Jakarta",d:"2 novembre 2026",s:"maroc.ma",x:"La « Semaine du Maroc » met en lumière le patrimoine et le savoir-faire du Royaume à Jakarta, en Indonésie."},
{c:"Actualité",t:"Budget 2027 : les débats se poursuivent à la Chambre",d:"29 octobre 2026",s:"maroc.ma",x:"Les équilibres budgétaires et l’équité sociale dominent les débats de la Commission des finances à la Chambre des représentants, au sujet du projet de loi de finances 2027."},
{c:"Sciences",t:"L’argan marocain récompensé en Chine",d:"28 octobre 2026",s:"maroc.ma",x:"Une recherche marocaine sur l’argan a reçu une double distinction au Sommet mondial des jeunes scientifiques, en Chine."},
{c:"Sport",t:"CAN 2025 : le verdict du TAS attendu fin novembre",d:"19 octobre 2026",s:"allafrica.com",x:"Le Tribunal arbitral du sport a indiqué que sa sentence sur le litige autour de la finale de la CAN 2025 entre le Maroc et le Sénégal est attendue à la fin du mois de novembre 2026.\n\nLa finale s’était jouée le 18 janvier 2026 à Rabat. Les arbitres ont choisi de rendre une décision complète, avec ses motifs juridiques, ce qui prendra plusieurs semaines."},
{c:"Culture",t:"Marion Cotillard présidera le jury du festival de Marrakech",d:"13 octobre 2026",s:"hespress.com",x:"L’actrice française Marion Cotillard présidera le jury de la 23e édition du Festival international du film de Marrakech."},
{c:"Sciences",t:"Un cœur greffé s’adapte à l’âge de son receveur",d:"12 octobre 2026",s:"98.5 / Harvard",x:"Des chercheurs de l’Université Harvard ont découvert qu’un cœur transplanté adapte peu à peu ses marqueurs de vieillissement à l’âge biologique de son nouvel hôte.\n\nCette découverte a été faite chez la souris."},
{c:"Culture",t:"Les Ateliers de l’Atlas, du 22 au 26 novembre",d:"Du 22 au 26 novembre 2026",s:"hespress.com",x:"La 9e édition des Ateliers de l’Atlas se tiendra en marge du festival de Marrakech. Le cinéaste Kleber Mendonça Filho en est le parrain.\n\nCette plateforme accompagne les cinéastes marocains, arabes et africains."}
];
var cats=["À la une","Actualité","Sport","Culture","Sciences"],cur="À la une",L=[],idx=0,busy=false;
function esc(s){return s.replace(/[&<>]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[m]})}
function chips(){var n=document.getElementById("chips");n.innerHTML="";cats.forEach(function(c){var b=document.createElement("button");b.textContent=c;if(c===cur)b.className="on";b.onclick=function(){cur=c;chips();mosaic()};n.appendChild(b)})}
function mosaic(){
L=D.filter(function(a){return cur==="À la une"||a.c===cur});
var m=document.getElementById("mosaic");m.innerHTML="";
L.forEach(function(a,i){var t=document.createElement("div");
t.className="tile g"+G[a.c]+(i===0?" big":i===3?" wide":"");
t.innerHTML='<span class="em">'+E[a.c]+'</span><div class="txt"><div class="tag">'+esc(a.c)+'</div><h3>'+esc(a.t)+'</h3></div>';
t.onclick=function(){openR(i)};m.appendChild(t)})}
function fill(){var a=L[idx],p=document.getElementById("page");
p.innerHTML='<div class="cover g'+G[a.c]+'">'+E[a.c]+'</div><div class="body"><div class="tag">'+esc(a.c)+'</div><h2>'+esc(a.t)+'</h2><div class="date">'+a.d+(a.s?' · Source : '+esc(a.s):'')+'</div>'+a.x.split("\n\n").map(function(s){return"<p>"+esc(s)+"</p>"}).join("")+'</div>';
p.scrollTop=0;
document.getElementById("count").textContent=(idx+1)+" / "+L.length;
document.getElementById("prev").disabled=idx===0;
document.getElementById("next").disabled=idx===L.length-1}
function openR(i){idx=i;fill();document.getElementById("reader").className="reader show"}
function closeR(){document.getElementById("reader").className="reader"}
function go(d){
if(busy||idx+d<0||idx+d>=L.length)return;busy=true;
var p=document.getElementById("page");
p.style.transition="transform .22s ease-in,opacity .22s";
p.style.transform="perspective(1200px) rotateY("+(d>0?-75:75)+"deg)";p.style.opacity="0";
setTimeout(function(){
idx+=d;fill();
p.style.transition="none";p.style.transform="perspective(1200px) rotateY("+(d>0?75:-75)+"deg)";
void p.offsetWidth;
p.style.transition="transform .22s ease-out,opacity .22s";p.style.transform="none";p.style.opacity="1";
setTimeout(function(){busy=false},230)},220)}
document.getElementById("close").onclick=closeR;
document.getElementById("prev").onclick=function(){go(-1)};
document.getElementById("next").onclick=function(){go(1)};
document.addEventListener("keydown",function(e){var r=document.getElementById("reader");if(r.className.indexOf("show")<0)return;
if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);if(e.key==="Escape")closeR()});
var sx=0;
document.getElementById("reader").addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
document.getElementById("reader").addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60)go(dx<0?1:-1)},{passive:true});
chips();mosaic();
</script>
</body>
</html>
